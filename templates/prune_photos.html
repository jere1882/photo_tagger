<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prune Photos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0e0e0e;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── TOP BAR ─────────────────────────────────────────────── */
  #top-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #181818;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
    min-height: 44px;
  }

  #home-btn {
    background: none;
    border: none;
    color: #555;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 5px;
    white-space: nowrap;
  }
  #home-btn:hover { background: #222; color: #aaa; }
  #divider { width: 1px; height: 18px; background: #2a2a2a; }

  #folder-input {
    flex: 1;
    background: #222;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: #ccc;
    font-size: 12px;
    padding: 5px 10px;
    outline: none;
    font-family: 'SF Mono', 'Menlo', monospace;
  }
  #folder-input:focus { border-color: #555; color: #fff; }

  .top-btn {
    background: #2d2d2d;
    border: 1px solid #444;
    border-radius: 6px;
    color: #ccc;
    font-size: 12px;
    padding: 5px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .top-btn:hover { background: #3a3a3a; color: #fff; }

  /* ─── FOLDER BROWSER MODAL ────────────────────────────────── */
  #browser-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #browser-backdrop.open { display: flex; }

  #browser-modal {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 12px;
    width: 540px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.7);
  }

  #browser-header {
    padding: 12px 16px;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  #browser-up {
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: #aaa;
    font-size: 13px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #browser-up:hover { background: #333; color: #fff; }
  #browser-up:disabled { opacity: 0.3; cursor: default; }

  #browser-path {
    flex: 1;
    font-size: 11px;
    color: #555;
    font-family: 'SF Mono', 'Menlo', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    direction: rtl;
    text-align: left;
  }

  #browser-cancel {
    background: none;
    border: none;
    color: #555;
    font-size: 18px;
    cursor: pointer;
    padding: 2px 4px;
  }
  #browser-cancel:hover { color: #aaa; }

  #browser-list { overflow-y: auto; flex: 1; padding: 6px 0; }

  .browser-item {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    cursor: pointer;
    gap: 10px;
    transition: background 0.08s;
  }
  .browser-item:hover { background: #262626; }
  .browser-item .folder-icon { font-size: 16px; }
  .browser-item .folder-name { flex: 1; font-size: 13px; color: #ddd; }

  #browser-footer {
    padding: 10px 16px;
    border-top: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  #browser-select {
    background: #1a4a8a;
    border: 1px solid #2a6acc;
    border-radius: 7px;
    color: #fff;
    font-size: 13px;
    padding: 7px 18px;
    cursor: pointer;
    font-weight: 500;
  }
  #browser-select:hover { background: #1f5aa0; }

  #browser-current-label {
    font-size: 11px;
    color: #555;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ─── MAIN CONTENT ────────────────────────────────────────── */
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #empty-state {
    margin-top: 80px;
    text-align: center;
    color: #3a3a3a;
  }
  #empty-state .big-icon { font-size: 48px; margin-bottom: 16px; }
  #empty-state p { font-size: 14px; color: #555; line-height: 1.6; }

  #preview-section { width: 100%; max-width: 640px; }

  #preview-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  #preview-header h2 { font-size: 16px; font-weight: 600; color: #ccc; }
  #preview-header .summary { font-size: 12px; color: #555; }

  #scan-notice {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #8ab4f8;
    background: #0a1420;
    border: 1px solid #1a4a8a;
    border-radius: 8px;
    padding: 9px 14px;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  #folders-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 28px; }

  .folder-row {
    background: #171717;
    border: 1px solid #222;
    border-radius: 8px;
    overflow: hidden;
  }

  .folder-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    cursor: pointer;
  }
  .folder-head:hover { background: #1c1c1c; }

  .folder-head input[type="checkbox"] { width: 15px; height: 15px; accent-color: #b33; cursor: pointer; }

  .folder-name { font-size: 14px; font-weight: 500; color: #ddd; flex: 1; }
  .folder-counts { font-size: 12px; color: #555; white-space: nowrap; }
  .folder-counts .prune-count { color: #e88; }
  .folder-chevron { font-size: 11px; color: #555; transition: transform 0.15s; }
  .folder-row.expanded .folder-chevron { transform: rotate(90deg); }

  .folder-files {
    display: none;
    padding: 4px 16px 12px 43px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .folder-row.expanded .folder-files { display: flex; }

  .file-chip {
    font-size: 11px;
    font-family: 'SF Mono', 'Menlo', monospace;
    color: #999;
    background: #222;
    border: 1px solid #333;
    border-radius: 5px;
    padding: 3px 8px;
    text-decoration: none;
    cursor: pointer;
  }
  .file-chip:hover { color: #fff; border-color: #555; background: #2a2a2a; }

  .folder-clean {
    font-size: 12px;
    color: #3a5a3a;
    padding: 11px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #prune-btn {
    background: #6a1414;
    border: 1px solid #a02020;
    border-radius: 9px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 36px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    align-self: center;
    display: block;
    margin: 0 auto;
  }
  #prune-btn:hover { background: #8a1a1a; }
  #prune-btn:active { transform: scale(0.97); }
  #prune-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  #done-section {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 60px;
  }
  #done-section .done-icon { font-size: 48px; }
  #done-section h2 { font-size: 20px; color: #ccc; }
  #done-section p { font-size: 13px; color: #555; }

  #reset-btn {
    margin-top: 8px;
    background: #222;
    border: 1px solid #333;
    border-radius: 7px;
    color: #aaa;
    font-size: 13px;
    padding: 8px 20px;
    cursor: pointer;
  }
  #reset-btn:hover { background: #2a2a2a; color: #ddd; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="top-bar">
  <button id="home-btn" onclick="window.location='/'">&#8592; Home</button>
  <div id="divider"></div>
  <button class="top-btn" onclick="openBrowser()">Browse…</button>
  <input id="folder-input" type="text" placeholder="Select a vault folder, e.g. ~/travelBLog/Obsidian Vault…"
         spellcheck="false" autocomplete="off">
  <button class="top-btn" onclick="loadPreview()">Scan</button>
</div>

<!-- FOLDER BROWSER MODAL -->
<div id="browser-backdrop">
  <div id="browser-modal">
    <div id="browser-header">
      <button id="browser-up" onclick="browserUp()">&#8593; Up</button>
      <span id="browser-path"></span>
      <button id="browser-cancel" onclick="closeBrowser()">&#10005;</button>
    </div>
    <div id="browser-list"></div>
    <div id="browser-footer">
      <button id="browser-select" onclick="selectCurrentFolder()">Scan this folder</button>
      <span id="browser-current-label"></span>
    </div>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <div id="empty-state">
    <div class="big-icon">🧹</div>
    <p>Select a vault folder to find images no markdown note references.<br>
       Matching is vault-wide (like Obsidian's), and deleted files go to the macOS Trash.</p>
  </div>

  <div id="preview-section" style="display:none">
    <div id="preview-header">
      <h2>Scan results</h2>
      <span class="summary" id="summary-text"></span>
    </div>
    <div id="scan-notice"></div>
    <div id="folders-list"></div>
    <button id="prune-btn" onclick="runPrune()">Move to Trash</button>
  </div>

  <div id="done-section" style="display:none">
    <div class="done-icon">✅</div>
    <h2>Done!</h2>
    <p id="done-text"></p>
    <button id="reset-btn" onclick="reset()">Scan again</button>
  </div>

</div>

<script>
  const API = '/prune-photos/api';
  let browserPath = '';
  let previewData = null;

  // ─── FOLDER BROWSER ───────────────────────────────────────────
  async function openBrowser() {
    document.getElementById('browser-backdrop').classList.add('open');
    document.getElementById('browser-list').innerHTML =
      '<div style="padding:20px 16px;color:#555;font-size:13px;">Loading…</div>';
    const current = document.getElementById('folder-input').value.trim();
    await browserNavigate(current || '/Users/jere/travelBLog');
  }

  function closeBrowser() {
    document.getElementById('browser-backdrop').classList.remove('open');
  }

  async function browserNavigate(path) {
    const res = await fetch(`${API}/listdirs?path=${encodeURIComponent(path)}`);
    const data = await res.json();
    if (data.error) return;
    browserPath = data.path;
    document.getElementById('browser-path').textContent = data.path;
    document.getElementById('browser-current-label').textContent = data.path.split('/').pop() || '/';
    document.getElementById('browser-up').disabled = !data.parent;
    const list = document.getElementById('browser-list');
    list.innerHTML = '';
    if (!data.entries.length) {
      list.innerHTML = '<div style="padding:20px 16px;color:#444;font-size:13px;">No subfolders here</div>';
      return;
    }
    data.entries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'browser-item';
      row.innerHTML = `
        <span class="folder-icon">📁</span>
        <span class="folder-name"></span>
      `;
      row.querySelector('.folder-name').textContent = e.name;
      row.addEventListener('click', () => browserNavigate(e.path));
      list.appendChild(row);
    });
  }

  async function browserUp() {
    const res = await fetch(`${API}/listdirs?path=${encodeURIComponent(browserPath)}`);
    const data = await res.json();
    if (data.parent) await browserNavigate(data.parent);
  }

  async function selectCurrentFolder() {
    closeBrowser();
    document.getElementById('folder-input').value = browserPath;
    await loadPreview();
  }

  // ─── SCAN / PREVIEW ───────────────────────────────────────────
  async function loadPreview() {
    const path = document.getElementById('folder-input').value.trim();
    if (!path) return;
    document.getElementById('folder-input').blur();

    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('done-section').style.display = 'none';
    document.getElementById('preview-section').style.display = 'block';
    document.getElementById('summary-text').textContent = 'Scanning…';
    document.getElementById('scan-notice').style.display = 'none';
    document.getElementById('folders-list').innerHTML =
      '<div style="padding:16px 0;color:#555;font-size:13px;">Reading notes and comparing images…</div>';
    document.getElementById('prune-btn').disabled = true;

    const res = await fetch(`${API}/preview`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder: path })
    });
    const data = await res.json();
    if (data.error) {
      alert(data.error);
      document.getElementById('preview-section').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    previewData = data;
    renderPreview(data);
  }

  function renderPreview(data) {
    document.getElementById('summary-text').textContent =
      `${data.total_images} images · ${data.md_count} notes scanned`;

    const notice = document.getElementById('scan-notice');
    notice.style.display = 'flex';
    notice.textContent = data.total_unreferenced > 0
      ? `${data.total_unreferenced} image${data.total_unreferenced !== 1 ? 's are' : ' is'} not referenced by any note in this tree. Click a folder to inspect the files (each opens in a new tab). Uncheck folders you want to leave alone.`
      : 'Every image in this tree is referenced by at least one note — nothing to prune. ✨';

    const list = document.getElementById('folders-list');
    list.innerHTML = '';

    data.folders.forEach((f, fi) => {
      const row = document.createElement('div');
      row.className = 'folder-row';
      const label = f.folder === '.' ? '(vault root)' : f.folder;

      if (!f.unreferenced.length) {
        const head = document.createElement('div');
        head.className = 'folder-clean';
        head.textContent = `✓ ${label} — all ${f.total} image${f.total !== 1 ? 's' : ''} referenced`;
        row.appendChild(head);
        list.appendChild(row);
        return;
      }

      const head = document.createElement('div');
      head.className = 'folder-head';
      head.innerHTML = `
        <input type="checkbox" checked data-fi="${fi}" onclick="event.stopPropagation(); updatePruneButton();">
        <span class="folder-name"></span>
        <span class="folder-counts"><span class="prune-count">${f.unreferenced.length} unreferenced</span> of ${f.total}</span>
        <span class="folder-chevron">&#9654;</span>
      `;
      head.querySelector('.folder-name').textContent = label;
      head.addEventListener('click', () => row.classList.toggle('expanded'));
      row.appendChild(head);

      const files = document.createElement('div');
      files.className = 'folder-files';
      f.unreferenced.forEach(rel => {
        const chip = document.createElement('a');
        chip.className = 'file-chip';
        chip.textContent = rel.split('/').pop();
        chip.href = `${API}/image?root=${encodeURIComponent(data.root)}&rel=${encodeURIComponent(rel)}`;
        chip.target = '_blank';
        chip.addEventListener('click', e => e.stopPropagation());
        files.appendChild(chip);
      });
      row.appendChild(files);
      list.appendChild(row);
    });

    updatePruneButton();
  }

  function selectedFiles() {
    if (!previewData) return [];
    const files = [];
    document.querySelectorAll('.folder-head input[type="checkbox"]:checked').forEach(cb => {
      files.push(...previewData.folders[parseInt(cb.dataset.fi, 10)].unreferenced);
    });
    return files;
  }

  function updatePruneButton() {
    const n = selectedFiles().length;
    const btn = document.getElementById('prune-btn');
    btn.disabled = n === 0;
    btn.textContent = n === 0
      ? 'Nothing to prune'
      : `Move ${n} photo${n !== 1 ? 's' : ''} to Trash`;
  }

  // ─── PRUNE ────────────────────────────────────────────────────
  async function runPrune() {
    const files = selectedFiles();
    if (!files.length) return;
    if (!confirm(`Move ${files.length} unreferenced image${files.length !== 1 ? 's' : ''} to the Trash?\n\nYou can restore them from the Trash if needed.`)) return;

    const btn = document.getElementById('prune-btn');
    btn.disabled = true;
    btn.textContent = 'Moving to Trash…';

    const res = await fetch(`${API}/run`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ root: previewData.root, files })
    });
    const data = await res.json();

    if (!data.ok) {
      alert(data.error || 'Something went wrong.');
      updatePruneButton();
      return;
    }

    document.getElementById('preview-section').style.display = 'none';
    document.getElementById('done-section').style.display = 'flex';
    document.getElementById('done-text').textContent =
      `Moved ${data.deleted} image${data.deleted !== 1 ? 's' : ''} to the Trash.` +
      (data.errors.length ? ` ${data.errors.length} file${data.errors.length !== 1 ? 's' : ''} could not be moved.` : '');
  }

  function reset() {
    document.getElementById('done-section').style.display = 'none';
    document.getElementById('preview-section').style.display = 'none';
    document.getElementById('empty-state').style.display = 'block';
    previewData = null;
    loadPreview();
  }

  // ─── KEYBOARD ─────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (document.getElementById('browser-backdrop').classList.contains('open')) {
      if (e.key === 'Escape') closeBrowser();
      return;
    }
    if (document.activeElement === document.getElementById('folder-input')) {
      if (e.key === 'Enter') loadPreview();
      if (e.key === 'Escape') document.getElementById('folder-input').blur();
    }
  });

  document.getElementById('browser-backdrop').addEventListener('click', e => {
    if (e.target === document.getElementById('browser-backdrop')) closeBrowser();
  });
</script>
</body>
</html>
