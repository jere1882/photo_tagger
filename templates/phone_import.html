<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Import</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0e0e0e;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── TOP BAR ─────────────────────────────────────────────── */
  #top-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #181818;
    border-bottom: 1px solid #2a2a2a;
    flex-shrink: 0;
    min-height: 44px;
  }

  #home-btn {
    background: none;
    border: none;
    color: #555;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 5px;
    white-space: nowrap;
  }
  #home-btn:hover { background: #222; color: #aaa; }
  #divider { width: 1px; height: 18px; background: #2a2a2a; }
  #title { font-size: 13px; color: #aaa; }

  /* ─── MAIN CARD ───────────────────────────────────────────── */
  #main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #card {
    background: #171717;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    width: 460px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  #card h2 { font-size: 17px; font-weight: 600; color: #ddd; }

  .hint { font-size: 12px; color: #888; line-height: 1.6; }
  .hint code { color: #00b8a9; font-size: 11px; }

  .dates { display: flex; gap: 16px; }
  .dates label {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    color: #aaa;
    flex: 1;
  }
  .dates input {
    background: #222;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: #ddd;
    font-size: 13px;
    padding: 7px 9px;
    outline: none;
    color-scheme: dark;
  }
  .dates input:focus { border-color: #555; }

  #go-btn {
    background: #1a4a8a;
    border: 1px solid #2a6acc;
    border-radius: 7px;
    color: #fff;
    font-size: 13px;
    padding: 9px 18px;
    cursor: pointer;
    font-weight: 500;
  }
  #go-btn:hover { background: #1f5aa0; }
  #go-btn:disabled { opacity: 0.4; cursor: default; }

  #status {
    font-size: 12px;
    color: #888;
    min-height: 34px;
    font-family: 'SF Mono', 'Menlo', monospace;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  #status.error { color: #e84040; }
  #status.ok { color: #00d4c4; }
</style>
</head>
<body>

<div id="top-bar">
  <button id="home-btn" onclick="location.href='/'">&#8592; Home</button>
  <div id="divider"></div>
  <span id="title">&#128241; Phone Import</span>
</div>

<div id="main">
  <div id="card">
    <h2>Copy photos &amp; videos from iPhone</h2>
    <p class="hint">Phone must be plugged in, unlocked and trusted. Files in the
    date range are copied — <strong>never deleted from the phone</strong> — into
    <code>~/photo_tool_export/&lt;day&gt;/</code>, grouped by day. Existing files
    are never overwritten: name clashes get a <code>_1</code>, <code>_2</code>… suffix.</p>
    <div class="dates">
      <label>From <input type="date" id="date-start"></label>
      <label>To <input type="date" id="date-end"></label>
    </div>
    <button id="go-btn" onclick="startImport()">Start import</button>
    <div id="status"></div>
  </div>
</div>

<script>
  let pollTimer = null;

  function init() {
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('date-start').value = today;
    document.getElementById('date-end').value = today;
    poll(); // pick up an already-running import after a page reload
  }

  async function startImport() {
    const start = document.getElementById('date-start').value;
    const end = document.getElementById('date-end').value;
    const statusEl = document.getElementById('status');
    if (!start || !end) {
      statusEl.className = 'error';
      statusEl.textContent = 'Pick both dates.';
      return;
    }
    statusEl.className = '';
    statusEl.textContent = 'Starting…';
    const res = await fetch('/phone-import/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start, end })
    });
    const data = await res.json();
    if (data.error) {
      statusEl.className = 'error';
      statusEl.textContent = data.error;
      return;
    }
    document.getElementById('go-btn').disabled = true;
    poll();
  }

  async function poll() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    const statusEl = document.getElementById('status');
    let s;
    try {
      const res = await fetch('/phone-import/api/status');
      s = await res.json();
    } catch (e) { return; }

    if (s.running) {
      statusEl.className = '';
      statusEl.textContent = `${s.message}\n${s.copied} copied`;
      document.getElementById('go-btn').disabled = true;
      pollTimer = setTimeout(poll, 1500);
    } else {
      document.getElementById('go-btn').disabled = false;
      if (s.error) {
        statusEl.className = 'error';
        statusEl.textContent = s.message;
      } else if (s.done) {
        statusEl.className = 'ok';
        statusEl.textContent = s.message;
      }
    }
  }

  init();
</script>
</body>
</html>
